<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynami-Learn | Professional Edition</title>
    <script src="static/vendor/chartjs/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:                  #10160F;
            --bg-strip:            #0B0F0B;
            --panel:               #171F19;
            --panel-alt:           #1C251E;
            --border:              #2A362D;
            --border-soft:         #212B23;
            --text:                #ECEBE3;
            --text-muted:          #8FA091;
            --text-dim:            #64766A;
            --accent:              #86B893;
            --accent-strong:       #3E7C59;
            --accent-strong-hover: #4B9169;
            --gold:                #C9A227;
            --gold-hover:          #DBB748;
            --success:             #6FAE7C;
            --warning:             #D4A857;
            --danger:              #C1666B;
            --canvas-bg:           #0A0F0A;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #EEF1EA; --bg-strip: #E4E9DF; --panel: #FFFFFF; --panel-alt: #F4F6F1;
                --border: #D6DCCF; --border-soft: #E1E6DA; --text: #1B231D; --text-muted: #57685A;
                --text-dim: #8B9A8D; --accent: #2F6B4A; --accent-strong: #2F6B4A;
                --accent-strong-hover: #255A3D; --gold: #8A6A16; --gold-hover: #715614;
                --success: #3F8557; --warning: #9C7A1F; --danger: #A14A44; --canvas-bg: #E4E9DF;
            }
        }

        /* Manual theme override — wins over the @media query above */
        :root[data-theme="dark"] {
            --bg: #10160F; --bg-strip: #0B0F0B; --panel: #171F19; --panel-alt: #1C251E;
            --border: #2A362D; --border-soft: #212B23; --text: #ECEBE3; --text-muted: #8FA091;
            --text-dim: #64766A; --accent: #86B893; --accent-strong: #3E7C59;
            --accent-strong-hover: #4B9169; --gold: #C9A227; --gold-hover: #DBB748;
            --success: #6FAE7C; --warning: #D4A857; --danger: #C1666B; --canvas-bg: #0A0F0A;
        }
        :root[data-theme="light"] {
            --bg: #EEF1EA; --bg-strip: #E4E9DF; --panel: #FFFFFF; --panel-alt: #F4F6F1;
            --border: #D6DCCF; --border-soft: #E1E6DA; --text: #1B231D; --text-muted: #57685A;
            --text-dim: #8B9A8D; --accent: #2F6B4A; --accent-strong: #2F6B4A;
            --accent-strong-hover: #255A3D; --gold: #8A6A16; --gold-hover: #715614;
            --success: #3F8557; --warning: #9C7A1F; --danger: #A14A44; --canvas-bg: #E4E9DF;
        }

        html { font-size: 14px; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            direction: ltr;
            font-size: 1rem;
        }

        aside {
            width: 320px;
            background: var(--bg-strip);
            border-right: 1px solid var(--border);
            padding: 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
            position: relative;
            transition: 0.3s;
        }

        h1 { margin: 0; color: var(--accent); font-size: 1.2rem; text-align: center; letter-spacing: 1px; font-weight: 800; margin-bottom: 0.2rem; text-transform: uppercase; font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif; }

        .tools-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px dashed var(--border);
            gap: 10px;
        }

        .font-group { display: flex; gap: 2px; }

        .tool-btn {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tool-btn:hover { background: var(--border); color: var(--text); border-color: var(--text-dim); }
        .fs-icon-btn { padding: 4px 10px; color: var(--accent); }

        #inputs-area { display: flex; flex-direction: column; gap: 0.65rem; position: relative; flex: 1; }
        #inputs-area.locked > .section { opacity: 0.3; filter: grayscale(1); pointer-events: none; }

        #inputs-area.locked:hover::after {
            content: "🔒 Simulation Active.\A Press RESET to edit.";
            white-space: pre-wrap;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(16, 22, 15, 0.98);
            border: 1px solid var(--gold); color: var(--gold);
            padding: 1rem; border-radius: 8px;
            font-size: 0.9rem; font-weight: 600; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            pointer-events: none; z-index: 100;
            width: 80%;
            animation: smoothPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes smoothPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        #controls-area {
            margin-top: auto;
            background: var(--panel);
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: flex;
            gap: 0.4rem;
            align-items: center;
            flex-shrink: 0;
        }

        .section { background: var(--panel-alt); padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.4rem; }
        .section-title { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 2px; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; }
        .label-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; line-height: 1.2; }
        .input-group { display: flex; gap: 0.3rem; align-items: center; }

        input[type="range"] { flex: 1; height: 4px; background: var(--border); border-radius: 2px; appearance: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--accent-strong); border-radius: 50%; cursor: pointer; }
        input[type="number"] { width: 4.5em; background: var(--bg); color: var(--accent); border: 1px solid var(--border); padding: 2px; border-radius: 3px; text-align: center; font-family: 'IBM Plex Mono', 'Consolas', ui-monospace, monospace; font-weight: bold; font-size: 0.8rem; }
        select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; padding: 3px; font-size: 0.8rem; width: 100%; }
        select:disabled { opacity: 0.5; cursor: not-allowed; }

        button.action-btn {
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; font-size: 0.75rem;
            background: var(--border); color: var(--text); border: 1px solid var(--text-dim);
            min-height: 28px;
        }
        button.action-btn:hover { background: var(--text-dim); }
        button.calc-btn { background: var(--accent-strong); color: #fff; border: none; width: 100%; display: block; margin-top: 0; }
        button.calc-btn:hover { background: var(--accent-strong-hover); }
        button.start-btn { background: var(--success); color: #fff; border: none; flex: 1; }
        button.start-btn:hover { background: var(--accent-strong); }
        button.start-btn.running { background: var(--danger); }
        button.start-btn.paused { background: var(--gold); }
        button.reset-btn { background: var(--text-dim); max-width: 60px; }

        /* Mode-preset buttons injected by JS — picks up accent-strong palette */
        .mode-preset-btn { font-size: 0.7rem; padding: 2px 6px; flex: 1; background: var(--bg); border-color: var(--accent-strong); color: var(--accent-strong); }

        .credit-footer { margin-top: 5px; padding-top: 5px; font-size: 0.7rem; color: var(--text-dim); text-align: center; border-top: 1px solid var(--border); line-height: 1.4; }

        main { flex: 1; padding: 0.6rem; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(220px, 1fr); gap: 0.6rem; overflow: hidden; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; position: relative; min-height: 320px; }
        .card-header { background: rgba(0,0,0,0.2); padding: 0 0.6rem; font-size: 0.8rem; color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 600; display: flex; justify-content: space-between; align-items: center; min-height: 32px; flex-shrink: 0; }
        .card-body { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .card-footer { padding: 0.4rem; border-top: 1px solid var(--border); background: rgba(0,0,0,0.1); flex-shrink: 0; }

        .matrix-container { font-family: 'IBM Plex Mono', 'Consolas', ui-monospace, monospace; font-size: 1.05rem; padding: 0.6rem; color: var(--text); line-height: 1.5; overflow: auto; flex: 1; }
        .modes-table { width: 100%; border-collapse: collapse; margin-bottom: 0.5rem; }
        .modes-table th { text-align: left; color: var(--text-dim); font-size: 0.8rem; border-bottom: 1px solid var(--border); padding: 4px; }
        .modes-table td { padding: 4px; border-bottom: 1px solid var(--border-soft); font-size: 0.95rem; }
        .mat-label { color: var(--text-muted); font-weight: bold; margin-top: 0.5rem; display: block; font-size: 0.8rem; }
        .mat-row { display: flex; gap: 0.5rem; font-size: 1rem; color: var(--accent); white-space: nowrap; }

        .stat-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .stat-tile { background: var(--panel-alt); border: 1px solid var(--border-soft); border-radius: 5px; padding: 8px 10px; flex: 1; min-width: 100px; }
        .stat-tile .k { font-size: 0.65rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); }
        .stat-tile .v { font-family: 'IBM Plex Mono', 'Consolas', ui-monospace, monospace; font-size: 1.05rem; color: var(--accent); margin-top: 3px; font-variant-numeric: tabular-nums; }
        .stat-tile .sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
        .stat-tile.primary { flex: 1.6; border: 1px solid var(--gold); background: rgba(201, 162, 39, 0.08); padding: 11px 13px; }
        .stat-tile.primary .k { color: var(--gold); }
        .stat-tile.primary .v { font-size: 1.35rem; color: var(--gold); }

        .tabs-header { display: flex; flex: 1; overflow-x: auto; height: 100%; }
        .tab-btn { padding: 0 12px; height: 100%; background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.75rem; font-weight: 600; border-right: 1px solid var(--border); transition: 0.2s; white-space: nowrap; }
        .tab-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .tab-btn.active { background: rgba(201, 162, 39, 0.12); color: var(--gold); border-bottom: 2px solid var(--gold); }
        .tab-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; visibility: hidden; pointer-events: none; }
        .tab-content.active { visibility: visible; pointer-events: auto; }
        .chart-container { position: relative; width: 100%; height: 100%; }
        #vizCanvas { width: 100% !important; height: 100% !important; display: block; }
        .legend-row { display: flex; gap: 0.6rem; font-size: 0.75rem; align-items: center; }
        .graph-scroll-container { height: 20px; background: var(--bg-strip); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 5px; flex-shrink: 0; }
        #time-slider { width: 100%; cursor: pointer; height: 4px; }

        .info-btn { background: transparent; color: var(--gold); border: 1px solid var(--gold); border-radius: 50%; width: 14px; height: 14px; font-size: 10px; font-family: serif; font-weight: bold; font-style: italic; cursor: pointer; margin-left: 3px; display: inline-flex; align-items: center; justify-content: center; opacity: 0.8; transition: 0.2s; }
        .info-btn:hover { background: var(--gold); color: #000; opacity: 1; }

        .info-tooltip { position: absolute; background: rgba(16, 22, 15, 0.98); border: 1px solid var(--accent); border-left: 3px solid var(--gold); color: var(--text); padding: 0; border-radius: 4px; font-size: 0.85rem; z-index: 20000; width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,0.95); animation: popIn 0.2s ease-out; display: flex; flex-direction: column; }
        .tooltip-header { background: rgba(255,255,255,0.05); padding: 0.5rem; cursor: move; font-weight: bold; font-size: 0.9rem; color: var(--gold); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .tooltip-content { padding: 0.6rem; line-height: 1.5; white-space: pre-wrap; }
        .tooltip-close { background: transparent; border: none; color: var(--danger); font-weight: bold; font-size: 14px; cursor: pointer; padding: 0 4px; }
        .tooltip-close:hover { transform: scale(1.1); }
        @keyframes popIn { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform: scale(1); } }

        body.sim-running { cursor: not-allowed; }
        body.sim-running aside { pointer-events: none; opacity: 0.9; }
        body.sim-running #controls-area { pointer-events: auto !important; opacity: 1 !important; cursor: default; }
        body.sim-running .tools-row { pointer-events: auto !important; opacity: 1 !important; cursor: default; }
        body.sim-running main { cursor: default; pointer-events: auto !important; }

        @media (max-width: 900px) {
            body { flex-direction: column; height: auto; overflow: auto; }
            aside { width: 100%; height: auto; max-height: 45vh; border-right: none; border-bottom: 2px solid var(--border); box-sizing: border-box; }
            main { display: flex; flex-direction: column; gap: 10px; height: auto; overflow: visible; padding-bottom: 40px; }
            .card { min-height: 300px; width: 100%; }
            .card[style*="grid-column: span 2;"] { grid-column: auto !important; }
        }
    </style>
</head>
<body>

<aside id="sidebar">
    <h1>Dynami-Learn</h1>

    <div class="tools-row">
        <div class="font-group">
            <button class="tool-btn" onclick="changeFontSize(-1)">A-</button>
            <button class="tool-btn" onclick="resetFontSize()">Reset Font</button>
            <button class="tool-btn" onclick="changeFontSize(1)">A+</button>
        </div>
        <button class="tool-btn" id="btn-theme" onclick="toggleTheme()" title="Toggle light/dark theme">◑</button>
        <button class="tool-btn fs-icon-btn" onclick="toggleFullScreen()" title="Full Screen">⛶</button>
    </div>

    <div id="inputs-area">
        <div class="section">
            <div class="section-title">1. Structure <button class="info-btn" onclick="showTooltip('stories', event)">i</button></div>
            <div class="label-row"><label>Stories:</label><select id="dof-select" onchange="onDofChange()"><option value="1">1 Story (SDOF)</option><option value="2" selected>2 Stories (2DOF)</option><option value="3">3 Stories (3DOF)</option></select></div>
        </div>

        <div class="section">
            <div class="section-title">2. Properties (Per Floor)</div>

            <div id="dynamic-properties"></div>

            <div class="label-row" style="border-top:1px dashed var(--border); padding-top:4px; margin-top:6px;">
                <label>Profile:</label>
                <select id="profile-type" onchange="updateProfileType()" style="width: auto;">
                    <option value="circle">Circular</option>
                    <option value="rect">Rectangular</option>
                </select>
            </div>
            <div id="geo-inputs"></div>
            <div style="font-size:0.7rem; color:var(--text-dim); margin-top: -2px;">Ic: <span id="val-Ic">...</span> m⁴</div>
        </div>

        <div class="section">
            <div class="section-title">3. Damping (Zeta 0-1) <button class="info-btn" onclick="showTooltip('damping', event)">i</button></div>
            <div id="damping-container" style="display:flex; flex-direction:column; gap:4px;"></div>
        </div>

        <div class="section">
            <div class="section-title">4. Simulation Setup</div>
            <div class="label-row"><label>Type:</label>
                <select id="force-type" onchange="toggleDuration()" style="width:auto;">
                    <option value="continuous">Continuous Harmonic</option>
                    <option value="pulse" selected>Pulse Harmonic</option>
                </select>
            </div>
            <div id="dur-box" style="margin-bottom:2px;"><div class="label-row"><label>Duration (s):</label></div><div class="input-group"><input type="range" id="slide-dur" min="0.5" max="30" step="0.1" value="2" oninput="syncInputs('dur', true)"><input type="number" id="num-dur" value="2" min="0.1" max="50" oninput="syncInputs('dur', false)" onchange="validateInput('dur')"></div></div>

            <div class="label-row"><label>Freq (Hz): <span id="val-w" style="color:var(--gold); font-size:0.65rem;"></span> <button class="info-btn" onclick="showTooltip('freq', event)">i</button></label></div>

            <div id="mode-presets" style="display:flex; gap:4px; margin-bottom:6px; flex-wrap:wrap; min-height:20px;"></div>

            <div class="input-group">
            <input type="range" id="slide-F" min="0.1" max="10" step="0.01" value="2" oninput="syncInputs('F', true)">
                <input type="number" id="num-F" value="2" min="0.1" max="20" step="0.0001" oninput="syncInputs('F', false)" onchange="validateInput('F')">
            </div>
        </div>
    </div>

    <div id="controls-area">
        <select id="sim-speed" style="width:65px; height:28px; font-weight:bold; color:var(--gold); background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:0 4px; margin-right:auto;">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
        </select>
        <button id="btn-sim" class="action-btn start-btn" onclick="toggleSimulation()">Start</button>
        <button id="btn-reset" class="action-btn reset-btn" onclick="resetSimulation()">Reset</button>
    </div>

    <div class="credit-footer">
        Powered by Dekel Winkler & Jeremy Scalais<br>
        <span style="opacity:0.8">Led by Dr. Assaf Shmerling</span>
    </div>
</aside>
<main>
    <div class="card"><div class="card-header">VISUALIZER</div><div class="card-body" style="background:var(--canvas-bg); padding:0;"><canvas id="vizCanvas"></canvas></div></div>
    <div class="card">
        <div class="card-header">SYSTEM PROPERTIES</div>
        <div class="card-body matrix-container" id="results-area">System not calculated yet.</div>
        <div class="card-footer"><button class="action-btn calc-btn" onclick="calculateSystem()">Calculate Matrices</button></div>
    </div>
    <div class="card" style="grid-column: span 2;">
        <div class="card-header" style="padding:0; padding-right:10px;">
            <div id="tabs-header" class="tabs-header"></div>
            <div class="legend-row">
                <label class="legend-item" style="color:var(--accent)"><input type="checkbox" id="chk-x" checked onchange="updateGraphVisibility()"> Disp [m]</label>
                <label class="legend-item" style="color:var(--success)"><input type="checkbox" id="chk-v" checked onchange="updateGraphVisibility()"> Vel [m/s]</label>
                <label class="legend-item" style="color:var(--gold)"><input type="checkbox" id="chk-a" checked onchange="updateGraphVisibility()"> Acc [m/s²]</label>
            </div>
        </div>
        <div id="tabs-body" class="card-body" style="padding:0; border-bottom: none;"></div>
        <div class="graph-scroll-container"><input type="range" id="time-slider" min="0" max="100" value="100" step="0.1" oninput="onTimeScroll()"></div>
    </div>
</main>

<script src="main.js"></script>

</body>
</html>
